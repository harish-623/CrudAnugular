<div class="modal-backdrop fade show"></div>

<div class="modal d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Driver Registration</h5>
                <button type="button" class="btn-close" (click)="close()"></button>
            </div>

            <div class="modal-body">
                <form [formGroup]="driverForm">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Driving License Number</label>
                        <input type="text" class="form-control" formControlName="dlNumber"
                            placeholder="Enter DL number" />
                    </div>

                    <div *ngIf="message" class="alert alert-info">
                        {{ message }}
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" (click)="close()">Cancel</button>
                <button class="btn btn-primary" [disabled]="driverForm.invalid || loading" (click)="submit()">
                    {{ loading ? 'Submitting...' : 'Submit' }}
                </button>
            </div>

        </div>
    </div>
</div>
