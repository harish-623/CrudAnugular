<!-- Loader visible ONLY when API is loading -->
<app-loader *ngIf="loading"></app-loader>

<!-- Main container hidden while loading -->
<div class="forgot-container" *ngIf="!loading">

  <h2 class="mb-4">Forgot Password</h2>

  <!-- STEP 1: Enter Email -->
  <div *ngIf="step === 1">
    <label>Email</label>
    <input 
      type="email" 
      class="form-control"
      [(ngModel)]="email"
      placeholder="Enter your registered email">

    <button class="btn btn-primary mt-3" (click)="sendOtp()">
      Send OTP
    </button>

    <!-- Show API response message -->
    <div *ngIf="message" class="alert alert-info mt-3">
      {{ message }}
    </div>
  </div>

  <!-- STEP 2: Verify OTP -->
  <div *ngIf="step === 2">
    <label>Enter OTP</label>
    <input 
      type="text"
      class="form-control"
      [(ngModel)]="otp"
      placeholder="Enter the OTP">

    <button class="btn btn-success mt-3" (click)="verifyOtp()">
      Verify OTP
    </button>

    <div *ngIf="message" class="alert alert-info mt-3">
      {{ message }}
    </div>
  </div>

  <!-- STEP 3: Reset Password -->
  <div *ngIf="step === 3">
    <label>New Password</label>
    <input
      [type]="showPassword ? 'text' : 'password'"
      class="form-control"
      [(ngModel)]="newPassword"
      placeholder="Enter new password">

    <div class="form-check mt-2">
      <input
        type="checkbox"
        id="showPasswordCheckbox"
        class="form-check-input"
        (change)="togglePassword()"
      />
      <label for="showPasswordCheckbox" class="form-check-label">Show Password</label>
    </div>

    <button class="btn btn-primary mt-3" (click)="resetPassword()">
      Reset Password
    </button>

    <div *ngIf="message" class="alert alert-success mt-3">
      {{ message }}
    </div>
  </div>

</div>
