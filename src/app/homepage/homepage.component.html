<div class="container-fluid p-0">
  <!-- Header Section -->
  <header class="netflix-header text-center">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <!-- <a class="navbar-brand text-light" href="#">NetFlix</a> -->
      <a class="navbar-brand text-light" href="#">
        <img src="assets/logo/images.png" alt="NetFlix Logo" class="logo">
        </a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- <div class="navbar-collapse" id="navbarNav"> -->
        <ul class="navbar-nav flex-column ml-auto">
          <li class="nav-item">
            <a class="nav-link text-light" routerLink="/home">Hom</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" routerLink="/movies">Movies</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" routerLink="/tvshows">TV Shows</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" routerLink="/profile">Profile</a>
          </li>
        </ul>
      <!-- </div> -->
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero-section" style="background-image: url('https://source.unsplash.com/1600x900/?movie');">
    <div class="hero-overlay text-center">
      <h1 class="text-light">Discover Your Next Favorite Show</h1>
      <p class="text-light">Stream anywhere, anytime.</p>
      <button class="btn btn-danger btn-lg" routerLink="/browse">Start Watching</button>
    </div>
  </section>

  <!-- Popular Section -->
  <section class="popular-section p-3">
    <h2 class="text-light">Popular Now</h2>
    <div id="popularCarousel" class="carousel slide" data-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://source.unsplash.com/1600x900/?action" class="d-block w-100" alt="Action Movie">
        </div>
        <div class="carousel-item">
          <img src="https://source.unsplash.com/1600x900/?drama" class="d-block w-100" alt="Drama Movie">
        </div>
        <div class="carousel-item">
          <img src="https://source.unsplash.com/1600x900/?comedy" class="d-block w-100" alt="Comedy Movie">
        </div>
      </div>
      <a class="carousel-control-prev" href="#popularCarousel" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#popularCarousel" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
  </section>

  <!-- Categories Section -->
  <section class="categories-section p-3">
    <h2 class="text-light">Categories</h2>
    <div class="row">
      <div class="col-md-3">
        <img src="https://source.unsplash.com/400x300/?adventure" class="img-fluid rounded" alt="Adventure">
        <h5 class="text-light mt-2">Adventure</h5>
      </div>
      <div class="col-md-3">
        <img src="https://source.unsplash.com/400x300/?horror" class="img-fluid rounded" alt="Horror">
        <h5 class="text-light mt-2">Horror</h5>
      </div>
      <div class="col-md-3">
        <img src="https://source.unsplash.com/400x300/?romance" class="img-fluid rounded" alt="Romance">
        <h5 class="text-light mt-2">Romance</h5>
      </div>
      <div class="col-md-3">
        <img src="https://source.unsplash.com/400x300/?sci-fi" class="img-fluid rounded" alt="Sci-Fi">
        <h5 class="text-light mt-2">Sci-Fi</h5>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer bg-dark text-light text-center p-3">
    <p>&copy; 2024 MyFlix. All rights reserved.</p>
  </footer>
</div>
