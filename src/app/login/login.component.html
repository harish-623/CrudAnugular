<section class="min-vh-100 d-flex align-items-center bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">

        <div class="card border-0 shadow-lg">
          <div class="card-body p-4 p-md-5">

            <!-- HEADER -->
            <div class="text-center mb-4">
              <h3 class="fw-bold mb-1">Login to VyroPool</h3>
              <p class="text-muted mb-0">Access your account securely</p>
            </div>

            <!-- LOADER -->
            <div *ngIf="loading" class="text-center my-3">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2 small">Logging you in...</p>
            </div>

            <!-- LOGIN FORM -->
            <form
              [formGroup]="loginForm"
              (ngSubmit)="onSubmitLogin()"
              *ngIf="!loading"
            >

              <!-- USERNAME -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="username"
                  placeholder="Enter username"
                />
              </div>

              <!-- PASSWORD -->
              <div class="mb-2">
                <label class="form-label fw-semibold">Password</label>
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  formControlName="password"
                  placeholder="Enter password"
                />
              </div>

              <!-- SHOW PASSWORD -->
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="showPassword"
                  (change)="togglePassword()"
                />
                <label class="form-check-label small" for="showPassword">
                  Show password
                </label>
              </div>

              <!-- LOGIN BUTTON -->
              <div class="d-grid mb-3">
                <button class="btn btn-primary btn-lg" type="submit">
                  Login
                </button>
              </div>

              <!-- REGISTER + FORGOT -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  (click)="navigateToRegister()">
                  Create account
                </button>

                <a
                  class="link-primary small"
                  (click)="navigateToForgotPassword()">
                  Forgot password?
                </a>
              </div>

              <!-- ERROR / STATUS -->
              <div
                *ngIf="loginError"
                class="alert mt-3"
                [ngClass]="responseClass"
                role="alert"
              >
                {{ loginError }}
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
