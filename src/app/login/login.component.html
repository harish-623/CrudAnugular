
   <div class="login-container">

    <div *ngIf="loading" class="loader-container">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()" class="login-form">
      <h2>Login Harish</h2>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" formControlName="username" class="form-control">
        <i class="fa-solid fa-user"></i>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" class="form-control">
      <div class="form-check mt-2">
    <input
      type="checkbox"
      id="showPasswordCheckbox"
      class="form-check-input"
      (change)="togglePassword()"
    />
    <label for="showPasswordCheckbox" class="form-check-label">Show Password</label>
  </div>
      
</div>

      
      
      <button type="submit" class="btn btn-primary">Login</button>

      <button type="button" class="btn btn-secondary" (click)="navigateToRegister()">Register</button>

      
      <button class="forgot-password">
      <a (click)="navigateToForgotPassword()" class="forgot-link">Forgot Password?</a>
      </button>

      <!-- <div *ngIf="loginError" class="status-message">
        {{ loginError }}
      </div> -->
      <div *ngIf="loginError" class="custom-alert" [ngClass]="responseClass">
  <span class="icon">
    <i *ngIf="responseClass === 'alert-success'" class="fas fa-check-circle"></i>
    <i *ngIf="responseClass === 'alert-danger'" class="fas fa-times-circle"></i>
    <i *ngIf="responseClass === 'alert-warning'" class="fas fa-exclamation-circle"></i>
  </span>
  <span class="text">{{ loginError }}</span>
</div>
    </form>

   
  </div>
