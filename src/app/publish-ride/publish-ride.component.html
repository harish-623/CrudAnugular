
<div class="home-btn-container">
    <button class="home-btn" (click)="goHome()">
      🏠 Home
    </button>
  </div>
<div class="profile-container">

<div class="publish-ride-container">
  <div class="ride-card">
    <h2 class="ride-title">🚗 Publish Your Ride</h2>
    <p class="ride-subtitle">Share your route and help others reach their destination</p>
    <form (ngSubmit)="publishRide()" #rideForm="ngForm" class="ride-form">
      <div class="form-group half">
  <label >
    Leaving From
  </label>
  <div class="relative">
    <select
      [(ngModel)]="leavingFrom"
      required
      class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none
             text-gray-700 bg-white appearance-none"
    >
      <option value="" disabled selected class="text-gray-400">
        Select your starting location
      </option>

      <option *ngFor="let place of placesList" [value]="place">
        {{ place }}
      </option>
    </select>
  </div>
</div>

<div class="form-group half">
  
  <label >
    Going To
  </label>
  
  <div class="relative">
    <select
      [(ngModel)]="goingTo"
      required
      class="w-full px-4 py-2 border border-gray-300 rounded-md outline-none
             text-gray-700 bg-white appearance-none"
    >
      <option value="" disabled selected class="text-gray-400">
        Select your destination location
      </option>
      <option *ngFor="let place of placesList" [value]="place">
        {{ place }}
      </option>
    </select>
  </div>
</div>



      <div class="form-inline">
       <div class="form-group half">
  <label>Date</label>
  <input
    type="date"
    [(ngModel)]="date"
    [min]="today"
    name="date"
    [ngModelOptions]="{ standalone: true }"

    required
  />
</div>
        

        <div class="form-group half">
          <label>Time</label>
          <input type="time" [(ngModel)]="time" name="time" required />
        </div>
      </div>

      <div class="form-inline">
        <div class="form-group half">
          <label>Passenger Limit</label>
          <select [(ngModel)]="passengerLimit" name="passengerLimit" required>
            <option [value]="1">1</option>
            <option [value]="2">2</option>
            <option [value]="3">3</option>
            <option [value]="4">4</option>
            <option [value]="5">5</option>
            <option [value]="6">6</option>
            <option [value]="7">7</option>
          </select>
        </div>

        <div class="form-group half">
          <label>Car Type</label>
          <input type="text" [(ngModel)]="carType" name="carType" required placeholder="E.g., Sedan, SUV" />
        </div>
      </div>

      <div class="form-group">
        <label>Fare (₹)</label>
        <input type="number"  required
    min="1"[(ngModel)]="amount" name="amount" required placeholder="Enter amount per seat" />
      </div>

      <button type="submit" class="publish-btn" [disabled]="rideForm.invalid">
        <span>🚀 Publish Ride</span>
      </button>

      <div *ngIf="loading" class="loader-container">
      <div class="spinner"></div>
      <p>Publishing your ride...</p>
    </div>
    </form>
  </div>
</div>
