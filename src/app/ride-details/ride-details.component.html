<div class="ride-detail-page">
  <!-- Header -->
  <header class="ride-header">
    <h1>Ride Details</h1>
  </header>

  <!-- Ride Info Card -->
  <div class="ride-card">
    <div class="ride-info">
      <h2>{{ ride.riderName }}</h2>
      <p><strong>From:</strong> {{ ride.from }}</p>
      <p><strong>To:</strong> {{ ride.to }}</p>
      <p><strong>Date:</strong> {{ ride.date }}</p>
      <p><strong>Time:</strong> {{ ride.time }}</p>
      <p><strong>Car Type:</strong> {{ ride.carType }}</p>
      <p><strong>Seats Available:</strong> {{ ride.passengerLimit }}</p>
      <p><strong>Price:</strong> ₹{{ ride.amount }}</p>
    </div>

    <button (click)="bookRide()" class="book-ride-btn">
  Book Ride
</button>
    <div class="contact-info">
      <h3>Contact Rider</h3>
      <p><strong>Phone:</strong> {{ ride.phoneNumber }}</p>
      <button (click)="callRider()">Call Rider</button>
      <button (click)="messageRider()">Message Rider</button>
    </div>
  </div>



  <!-- Back Button -->
  <!-- <div class="back-btn">
    <button (click)="goBack()">← Back to Search</button>
  </div> -->
</div>
