<div class="passenger-container">

  <h2 class="title">👥 Passengers Booked for Your Ride</h2>

  <!-- Ride Summary Card -->
  

  <!-- No Passengers -->
  <div *ngIf="passengers.length === 0" class="no-passengers">
    <p>No passengers have booked this ride yet.</p>
  </div>

  <!-- Passenger List -->
  <div *ngIf="passengers.length > 0" class="passenger-list">
    <h3>📋 Passenger List</h3>

    <div class="passenger-card" *ngFor="let p of passengers">
      <div class="passenger-info">
        <p><strong>Name:</strong> {{ p.name }}</p>
        <p><strong>Email:</strong> {{ p.email }}</p>
        <p><strong>Seats Booked:</strong> {{ p.seatsBooked }}</p>
        <p><strong>Booked On:</strong> {{ p.bookedOn | date:'medium' }}</p>
      </div>
   
    
     <div class="otp-section">

    <input
    *ngIf="!p.otpVerified"
      type="text"
      class="otp-input"
      placeholder="Enter OTP"
      [(ngModel)]="p.otp"
      maxlength="4"
    />
    <button class="verify-btn"
    *ngIf="!p.otpVerified"
      (click)="verifyRideOtp(p.bookingId,p.otp)">
      Verify OTP
    </button>

    <!-- OTP Verified Message -->
    <p *ngIf="p.otpVerified" class="otp-success">✔ OTP Verified Successfully</p>
     </div>

  </div>


  </div>

  <button class="back-btn" (click)="goBack()">⬅ Back</button>

</div>
