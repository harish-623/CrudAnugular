<div class="support-chat-page container py-5">
  <div class="row justify-content-center">
    <div class="col-xl-8 col-lg-10">
      <div class="card shadow-sm rounded-4 border-0">
        <div class="card-body p-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
            <div>
              <h2 class="fw-bold mb-2">AI Support Chat</h2>
              <p class="text-muted mb-0">Ask about help center topics, safety guidance, rider support, or how to find the best ride.</p>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-primary py-2 px-3">Powered by LLaMA backend</span>
              <button
                class="btn btn-outline-secondary btn-sm"
                type="button"
                (click)="clearHistory()"
                [disabled]="loading || messages.length <= defaultMessages.length"
              >
                Clear history
              </button>
            </div>
          </div>

          <div #chatWindow class="chat-window mb-4">
            <div *ngFor="let message of messages" class="chat-message" [ngClass]="message.role">
              <div class="message-bubble">
                <div class="message-meta">
                  <strong>{{ message.role === 'user' ? 'You' : 'Assistant' }}</strong>
                </div>
                <p class="mb-0 chat-message-text" [innerHTML]="formatMessageText(message.text)"></p>
              </div>
            </div>
          </div>

          <div class="input-group">
            <input
              type="text"
              class="form-control form-control-lg"
              placeholder="Type your question here..."
              [(ngModel)]="prompt"
              (keyup.enter)="send()"
              [disabled]="loading"
            />
            <button class="btn btn-primary btn-lg" type="button" (click)="send()" [disabled]="loading">
              {{ loading ? 'Thinking...' : 'Send' }}
            </button>
          </div>

          <p class="text-muted small mt-3">Tip: ask about safety checks, ride booking, SOS support, or route features.</p>
        </div>
      </div>
    </div>
  </div>
</div>
